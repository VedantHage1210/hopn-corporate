services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hopn-app
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: hopn_db
      DB_USERNAME: hopn_user
      DB_PASSWORD: hopn_password
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - storage_data:/var/www/html/storage/app

  db:
    image: mysql:8.0
    container_name: hopn-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: hopn_db
      MYSQL_USER: hopn_user
      MYSQL_PASSWORD: hopn_password
      MYSQL_ROOT_PASSWORD: hopn_root_password
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-phopn_root_password"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db_data:
  storage_data:
